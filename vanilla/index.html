<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scroll Car Animation — ITZ FIZZ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- GSAP & ScrollTrigger CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow-x: hidden;
        background-color: #121212;
        color: white;
      }
      .section {
        height: 250vh;
        position: relative;
        background: #121212;
      }
      .track {
        position: sticky;
        top: 0;
        height: 100vh;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #d1d1d1;
        overflow: hidden;
      }
      .road {
        width: 100vw;
        height: 200px;
        background-color: #1e1e1e;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
      }
      .car {
        height: 200px;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 10;
        will-change: transform;
        pointer-events: none;
      }
      .trail {
        height: 200px;
        background: #45db7d;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
        width: 0;
      }
      .value-add {
        position: absolute;
        left: 6%;
        z-index: 5;
        display: flex;
        gap: 0.5rem;
        font-size: 5rem;
        font-weight: 800;
        letter-spacing: 0.15em;
        user-select: none;
        pointer-events: none;
      }
      .value-letter {
        color: #ffffff;
        opacity: 0;
        display: inline-block;
        transition: color 0.2s, opacity 0.2s;
        will-change: transform, opacity;
      }
      .text-box {
        opacity: 0;
        padding: 1.5rem 1.8rem;
        border-radius: 12px;
        position: absolute;
        z-index: 20;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        user-select: none;
        will-change: transform, opacity;
      }
      .num-box {
        font-size: 3.2rem;
        font-weight: 700;
        line-height: 1;
      }
      .desc-box {
        font-size: 0.9rem;
        font-weight: 500;
        line-height: 1.2;
        max-width: 160px;
      }
      #box1 {
        background: #def54f;
        color: #111;
        top: 8%;
        right: 30%;
      }
      #box2 {
        background: #6ac9ff;
        color: #111;
        bottom: 8%;
        right: 34%;
      }
      #box3 {
        background: #333333;
        color: #fff;
        top: 8%;
        right: 10%;
      }
      #box4 {
        background: #fa7328;
        color: #111;
        bottom: 8%;
        right: 12%;
      }
    </style>
  </head>
  <body>
    <!-- Top Bar -->
    <header class="fixed top-0 left-0 right-0 z-50 px-6 py-4 flex items-center justify-between">
      <span class="text-xl font-bold tracking-widest text-white uppercase font-mono">
        ITZ <span class="text-[#45db7d]">FIZZ</span>
      </span>
      <span class="text-xs font-mono px-3 py-1 rounded-full bg-black/40 text-white/80 border border-white/10">
        Scroll-Driven Hero Animation
      </span>
    </header>

    <!-- Main Scroll Section (250vh travel) -->
    <div class="section">
      <div class="track">
        
        <!-- Road Surface -->
        <div class="road" id="road">
          <!-- Car Asset -->
          <img
            src="../car.png"
            alt="McLaren 720S"
            class="car"
            id="car"
          />
          <!-- Green Trail -->
          <div class="trail" id="trail"></div>
          
          <!-- Letter-Spaced Headline -->
          <div class="value-add" id="valueText">
            <span class="value-letter">W</span>
            <span class="value-letter">E</span>
            <span class="value-letter">L</span>
            <span class="value-letter">C</span>
            <span class="value-letter">O</span>
            <span class="value-letter">M</span>
            <span class="value-letter">E</span>
            <span class="value-letter">&nbsp;</span>
            <span class="value-letter">I</span>
            <span class="value-letter">T</span>
            <span class="value-letter">Z</span>
            <span class="value-letter">F</span>
            <span class="value-letter">I</span>
            <span class="value-letter">Z</span>
            <span class="value-letter">Z</span>
          </div>
        </div>

        <!-- Impact Metrics / Statistics -->
        <div class="text-box" id="box1">
          <span class="num-box">58%</span>
          <span class="desc-box">Increase in pick up point use</span>
        </div>
        <div class="text-box" id="box2">
          <span class="num-box">23%</span>
          <span class="desc-box">Decreased in customer phone calls</span>
        </div>
        <div class="text-box" id="box3">
          <span class="num-box">27%</span>
          <span class="desc-box">Increase in pick up point use</span>
        </div>
        <div class="text-box" id="box4">
          <span class="num-box">40%</span>
          <span class="desc-box">Decreased in customer phone calls</span>
        </div>

        <!-- Scroll Indicator -->
        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 text-center pointer-events-none z-20">
          <p class="text-xs uppercase tracking-widest font-mono text-gray-700 font-bold mb-1">
            Scroll Down To Drive
          </p>
          <div class="w-4 h-7 mx-auto rounded-full border-2 border-gray-700/60 flex justify-center pt-1">
            <div class="w-1 h-2 bg-gray-800 rounded-full animate-bounce"></div>
          </div>
        </div>

      </div>
    </div>

    <script>
      gsap.registerPlugin(ScrollTrigger);

      const car = document.getElementById("car");
      const trail = document.getElementById("trail");
      const road = document.getElementById("road");
      const letters = gsap.utils.toArray(".value-letter");
      const boxes = [
        document.getElementById("box1"),
        document.getElementById("box2"),
        document.getElementById("box3"),
        document.getElementById("box4")
      ];

      // 1. Initial Load Animation (Requirement 2)
      const introTl = gsap.timeline();

      // Headline staggered reveal
      introTl.fromTo(
        letters,
        { opacity: 0, y: 25 },
        { opacity: 0.25, y: 0, stagger: 0.04, duration: 0.8, ease: "power2.out" }
      );

      // Statistics animate in one by one with subtle delay
      introTl.fromTo(
        boxes,
        { opacity: 0, y: 30, scale: 0.95 },
        { opacity: 1, y: 0, scale: 1, stagger: 0.15, duration: 0.8, ease: "power2.out" },
        "-=0.4"
      );

      introTl.fromTo(
        car,
        { x: -100, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.8, ease: "power2.out" },
        "-=0.6"
      );

      // 2. Pre-calculate letter X positions for performance (Requirement 4)
      let letterPositions = [];
      function calculatePositions() {
        const roadRect = road.getBoundingClientRect();
        letterPositions = letters.map(letter => {
          const rect = letter.getBoundingClientRect();
          return rect.left - roadRect.left + (rect.width * 0.5);
        });
      }
      calculatePositions();
      window.addEventListener("resize", calculatePositions);

      function getTravelDistance() {
        const roadWidth = road.offsetWidth;
        const carWidth = car.offsetWidth || 150;
        return roadWidth - carWidth - 10;
      }

      // 3. Scroll-Based Animation (Requirement 3)
      gsap.to(car, {
        scrollTrigger: {
          trigger: ".section",
          start: "top top",
          end: "bottom top",
          scrub: 1.2, // Natural easing and fluid interpolation
          pin: ".track",
          anticipatePin: 1,
          onUpdate: function () {
            const currentX = gsap.getProperty(car, "x") || 0;
            const carWidth = car.offsetWidth || 150;
            const carFrontX = currentX + (carWidth * 0.85);
            const carRearX = currentX + (carWidth * 0.15);

            // Update trail width
            gsap.set(trail, { width: Math.max(0, carRearX) });

            // Dynamic Letter Illumination
            letters.forEach((letter, i) => {
              const letterX = letterPositions[i];
              if (carFrontX >= letterX) {
                letter.style.opacity = 1;
                letter.style.color = "#45db7d";
              } else {
                letter.style.opacity = 0.25;
                letter.style.color = "#ffffff";
              }
            });
          }
        },
        x: () => getTravelDistance(),
        ease: "none"
      });
    </script>
  </body>
</html>
